apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iteo2026-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    name: iteo2026-ingress
  annotations:
    ingressClassName: public
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  tls:
  - hosts:
    - test-4.iteo.pro
    secretName: iteo2026-ingress-tls
  rules:
#-------------------------------------------------------
  - host: test-4.iteo.pro
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: iteo-2026-svc
              port:
                number: 80
#-------------------------------------------------------
